  :root {
    --ink: #252a2c;
    --muted: #6e7579;
    --blue: #345b70;
    --line: #dfe5e8;
    --serif: 'Article', Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #ffffff;
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage-wrapper {
    width: 1920px;
    height: 1080px;
    background: #ffffff;
    padding: 56px 96px 52px;
    display: flex;
    flex-direction: column;
    transform-origin: center center;
  }

  .top-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: 'PixelTitle', monospace;
    font-size: 62px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: 0;
  }

  .project-url {
    font-family: var(--sans);
    font-size: 34px;
    font-weight: 500;
    color: var(--blue);
    letter-spacing: -0.01em;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-shrink: 0;
  }

  .chart-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 76px;
    line-height: 1.06;
    letter-spacing: -2.4px;
    color: var(--ink);
  }

  .chart-title .pixel-title {
    font-family: 'PixelTitle', monospace;
    font-size: 0.92em;
    color: var(--blue);
  }

  .prompt-pill {
    font-family: var(--serif);
    font-size: 30px;
    color: var(--muted);
  }

  .prompt-pill strong {
    color: var(--ink);
    font-weight: 600;
  }

  
  .title-row {
    align-items: center;
    margin-bottom: 22px;
  }

  .source-header-card {
    display: flex;
    align-items: center;
    gap: 18px;
    background: #f6f9fa;
    border: 1.5px solid var(--line);
    padding: 8px 16px 8px 10px;
  }

  .source-header-thumb {
    width: 68px;
    height: 68px;
    object-fit: cover;
    border: 1px solid #cfd8dc;
    display: block;
  }

  .source-header-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .source-header-eyebrow {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--blue);
    text-transform: uppercase;
  }

  .source-header-title {
    font-family: var(--serif);
    font-size: 26px;
    color: var(--ink);
  }

  /* 7-Column Grid (matches Card 2's generous 226x226 image size & zero bottom dead space!) */
  .board-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 28px;
    align-items: stretch;
  }

  .model-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .algo-col {
    padding-left: 12px;
    border-left: 2px dashed #c8d4da;
  }

  .bar-stage {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    border-bottom: 2px solid var(--ink);
    padding: 0 14px;
    background-image: linear-gradient(to bottom, #eef2f4 1px, transparent 1px);
    background-size: 100% 25%;
  }

  .bar-fill {
    width: 100%;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bar-score {
    font-family: var(--sans);
    font-size: 31px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.03em;
  }

  .model-label {
    height: 92px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
  }

  .model-name {
    font-family: var(--serif);
    font-size: 29px;
    line-height: 1.15;
    color: var(--ink);
    font-weight: 600;
  }

  .model-sub {
    font-family: var(--serif);
    font-size: 24px;
    line-height: 1.15;
    color: var(--muted);
  }

  .output-stage {
    width: 100%;
    aspect-ratio: 1;
    flex-shrink: 0;
    border: 1.5px solid var(--line);
    overflow: hidden;
  }

  .output-stage .pixel-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

</style>
</head>
