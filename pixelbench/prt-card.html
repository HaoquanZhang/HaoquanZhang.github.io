  :root {
    --ink: #252a2c;
    --muted: #6e7579;
    --blue: #345b70;
    --line: #dfe5e8;
    --serif: 'Article', Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #ffffff;
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage-wrapper {
    width: 1920px;
    height: 1080px;
    background: #ffffff;
    padding: 56px 96px 52px;
    display: flex;
    flex-direction: column;
    transform-origin: center center;
  }

  .top-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: 'PixelTitle', monospace;
    font-size: 62px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: 0;
  }

  .project-url {
    font-family: var(--sans);
    font-size: 34px;
    font-weight: 500;
    color: var(--blue);
    letter-spacing: -0.01em;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-shrink: 0;
  }

  .chart-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 76px;
    line-height: 1.06;
    letter-spacing: -2.4px;
    color: var(--ink);
  }

  .chart-title .pixel-title {
    font-family: 'PixelTitle', monospace;
    font-size: 0.92em;
    color: var(--blue);
  }

  .prompt-pill {
    font-family: var(--serif);
    font-size: 30px;
    color: var(--muted);
  }

  .prompt-pill strong {
    color: var(--ink);
    font-weight: 600;
  }

  
  .title-row {
    margin-bottom: 14px;
  }

  /* Single-line full-width serif title (normal Charter/Cambria serif font throughout) */
  .prt-single-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 71.5px;
    line-height: 1.08;
    letter-spacing: -1.75px;
    color: var(--ink);
    white-space: nowrap;
  }

  .prt-deck {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
  }

  .prt-svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .prt-tick {
    font-family: var(--sans);
    font-size: 26px;
    font-weight: 600;
    fill: var(--muted);
  }

  .prt-val {
    font-family: var(--sans);
    font-size: 28px;
    font-weight: 700;
    fill: var(--ink);
    letter-spacing: -0.02em;
  }

  .prt-val.is-avg {
    font-size: 30px;
    fill: var(--blue);
  }

  .prt-val.is-neg {
    fill: #a8493d;
  }

  .prt-bench {
    font-family: var(--serif);
    font-size: 26px;
    fill: var(--ink);
  }

  .prt-bench.is-avg {
    font-weight: 700;
    fill: var(--blue);
  }

  .callout-plain {
    font-family: var(--serif);
    font-size: 26px;
    fill: var(--ink);
  }

</style>
</head>

  <script>
    function fitStage() {
      const stage = document.getElementById('stage');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    fitStage();
  </script>
</body>
</html>
